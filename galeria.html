<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🖼️ Galería · BLOG ARNALDO</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="description" content="Galería de fotos y proyectos del Blog Arnaldo." />
    <meta name="theme-color" content="#ff1744" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            background-image:
                repeating-linear-gradient(0deg, #1a1a1a 1px, transparent 1px),
                repeating-linear-gradient(90deg, #1a1a1a 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Impact', 'Arial Black', system-ui, sans-serif;
            color: #e0e0e0;
            line-height: 1.6;
            padding: 0 1rem 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 1200px;
            background: linear-gradient(135deg, #0d0d0d 60%, #1a0000);
            border-bottom: 6px solid #ff1744;
            padding: 2rem 2rem 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 40px rgba(255, 23, 68, 0.15);
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 1;
            background: linear-gradient(135deg, #ff1744, #ff9100);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 23, 68, 0.3);
        }

        .header .sub {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.5rem;
            letter-spacing: 1px;
        }

        .nav {
            width: 100%;
            max-width: 1200px;
            background: #111;
            border: 2px solid #2a2a2a;
            padding: 0.8rem 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .nav a {
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-decoration: none;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.1rem;
            transition: 0.2s;
            padding: 0.2rem 0;
            border-bottom: 3px solid transparent;
        }

        .nav a:hover {
            color: #ff1744;
            border-bottom-color: #ff1744;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .tarjeta {
            background: #121212;
            border: 2px solid #2a2a2a;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .tarjeta h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: #fff;
            border-bottom: 4px solid #ff1744;
            padding-bottom: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .tarjeta p.desc {
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #999;
            margin-bottom: 1.5rem;
        }

        /* GALERÍA */
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .galeria-item {
            position: relative;
            overflow: hidden;
            border: 2px solid #2a2a2a;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            background: #000;
        }

        .galeria-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(15%) contrast(110%);
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .galeria-item:hover img {
            transform: scale(1.08);
            filter: grayscale(0%) contrast(115%);
        }

        .galeria-item:hover {
            border-color: #ff1744;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .lightbox.activo {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 85vh;
            border: 3px solid #ff1744;
            box-shadow: 0 0 60px rgba(255, 23, 68, 0.3);
        }

        .lightbox-cerrar {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            font-size: 2rem;
            color: #fff;
            background: transparent;
            border: 2px solid #ff1744;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-family: 'Impact', sans-serif;
        }

        .lightbox-cerrar:hover {
            background: #ff1744;
            color: #000;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: #fff;
            background: rgba(17,17,17,0.7);
            border: 2px solid #ff1744;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-family: 'Impact', sans-serif;
        }

        .lightbox-nav:hover {
            background: #ff1744;
            color: #000;
        }

        #lightbox-prev { left: 1rem; }
        #lightbox-next { right: 1rem; }

        .footer {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            padding: 2rem 0 1rem;
            color: #555;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        @media (max-width: 700px) {
            .header h1 { font-size: 1.9rem; }
            .galeria-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 0.5rem;
            }
            .nav { gap: 1.2rem; padding: 0.6rem 1rem; }
            .nav a { font-size: 0.9rem; }
            .lightbox-nav { width: 40px; height: 40px; font-size: 1.5rem; }
            .lightbox-cerrar { top: 0.6rem; right: 0.6rem; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>🖼️ GALERÍA</h1>
        <div class="sub">TODAS LAS FOTOS · #_LIVE</div>
    </header>

    <nav class="nav">
        <a href="index.html">🏠 Inicio</a>
        <a href="index.html#galeria">🖼️ Galería</a>
        <a href="contacto.html">📧 Contacto</a>
        <a href="privacidad.html">🔒 Privacidad</a>
    </nav>

    <div class="container">
        <section class="tarjeta">
            <h2>🖼️ Todas las fotos</h2>
            <p class="desc">Tocá o hacé clic en cualquier imagen para verla ampliada.</p>
            <div class="galeria-grid" id="galeria-grid">
                <!-- Las imágenes se cargan desde JS -->
            </div>
        </section>

        <footer class="footer">
            <p>© 2026 <strong>N4N01944</strong> · </p>
        </footer>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-nav" id="lightbox-prev">‹</button>
        <button class="lightbox-cerrar" id="lightbox-cerrar">✕</button>
        <img src="" alt="Imagen ampliada" id="lightbox-img" />
        <button class="lightbox-nav" id="lightbox-next">›</button>
    </div>

    <script>
        // Agregá el nombre de archivo acá cada vez que subas una foto nueva a img/
        const imagenesGaleria = [
            "img/file_000000009540720eba54e16e68d6cd7b.png",
            "img/WORLD.JPG",
            "img/SISTEMA.jpg",
            "img/free-photo-of-rave-lasers(1).jpg",
            "img/camino-barrancas-neuquen.jpg"
        ];

        const galeriaGrid = document.getElementById("galeria-grid");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightbox-img");
        const lightboxCerrar = document.getElementById("lightbox-cerrar");
        const lightboxPrev = document.getElementById("lightbox-prev");
        const lightboxNext = document.getElementById("lightbox-next");

        let indiceActual = 0;

        imagenesGaleria.forEach((ruta, i) => {
            const item = document.createElement("div");
            item.className = "galeria-item";
            item.innerHTML = `<img src="${ruta}" alt="Foto de la galería" loading="lazy">`;
            item.onclick = () => abrirLightbox(i);
            galeriaGrid.appendChild(item);
        });

        function abrirLightbox(i) {
            indiceActual = i;
            lightboxImg.src = imagenesGaleria[i];
            lightbox.classList.add("activo");
        }

        function cerrarLightbox() {
            lightbox.classList.remove("activo");
            lightboxImg.src = "";
        }

        function mostrarAnterior() {
            indiceActual = (indiceActual - 1 + imagenesGaleria.length) % imagenesGaleria.length;
            lightboxImg.src = imagenesGaleria[indiceActual];
        }

        function mostrarSiguiente() {
            indiceActual = (indiceActual + 1) % imagenesGaleria.length;
            lightboxImg.src = imagenesGaleria[indiceActual];
        }

        lightboxCerrar.onclick = cerrarLightbox;
        lightboxPrev.onclick = (e) => { e.stopPropagation(); mostrarAnterior(); };
        lightboxNext.onclick = (e) => { e.stopPropagation(); mostrarSiguiente(); };

        lightbox.onclick = (e) => {
            if (e.target === lightbox) cerrarLightbox();
        };

        document.addEventListener("keydown", (e) => {
            if (!lightbox.classList.contains("activo")) return;
            if (e.key === "Escape") cerrarLightbox();
            if (e.key === "ArrowLeft") mostrarAnterior();
            if (e.key === "ArrowRight") mostrarSiguiente();
        });
    </script>

    <!-- GoatCounter -->
    <script data-goatcounter="https://al2pe.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
